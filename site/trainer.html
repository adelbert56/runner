  <script>
    // 全域錯誤兜底：任何 render 路徑丟出的例外，沒有這層會直接是空白畫面、
    // 使用者完全不知道發生什麼事。獨立於其他腳本之外（不依賴 showModal 等
    // app 內部函式），確保連開頭初始化就壞掉時也能顯示。
    (function () {
      var shown = false;
      function showRecoverableError() {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.setAttribute('role', 'alert');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff7ed;color:#9a3412;border-top:1px solid #f0d3ba;padding:12px 16px;font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap';
        var msg = document.createElement('span');
        msg.textContent = '頁面出了一點問題，畫面可能沒有完全跑完；重新整理通常就能修好，你的訓練資料不會受影響。';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '重新整理';
        btn.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid #f0d3ba;background:#fff;color:#9a3412;font-weight:700;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        bar.appendChild(msg);
        bar.appendChild(btn);
        document.body.appendChild(bar);
      }
      window.addEventListener('error', showRecoverableError);
      window.addEventListener('unhandledrejection', showRecoverableError);
    })();
  </script>
</head>
