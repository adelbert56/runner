<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>變體 A｜判讀流程帶</title><style>:root{--bg:#f6f8f5;--surface:#fff;--line:#d9e3db;--ink:#17251f;--muted:#607168;--green:#0e6245;--tint:#edf6ef;--yellow:#f5c84c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:32px 20px}.tag{color:var(--green);font-size:12px;font-weight:900;letter-spacing:.08em}h1{margin:4px 0 8px;font-size:30px;line-height:1.2}p{margin:0;color:var(--muted)}.card{margin-top:20px;padding:24px;border-radius:18px;background:var(--surface);box-shadow:0 6px 18px rgba(23,37,31,.05)}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.step{min-height:144px;padding:16px;border-radius:12px;background:var(--tint)}.step b{display:block;font-size:16px}.step span{display:block;margin-top:8px;color:var(--muted);font-size:13px}.active{background:#fff8df;border:1px solid rgba(245,200,76,.7)}.head{display:flex;justify-content:space-between;gap:16px;align-items:start}.pill{padding:6px 10px;border-radius:10px;background:var(--tint);color:var(--green);font-size:12px;font-weight:900}.decision{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}button{margin-top:16px;padding:10px 14px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:900}@media(max-width:640px){.flow{grid-template-columns:1fr 1fr}.wrap{padding:24px 16px}}</style><main class="wrap"><div class="tag">VARIANT A · 建議採用</div><h1>先知道判讀順序，再看本週結論</h1><p>位置：既有「本週放行判讀」卡片正上方。</p><section class="card"><div class="head"><div><div class="tag">COACHING LOGIC</div><b>你的課表不會因同步就自動改動</b><p>本週落在第 3 步：先確認主課品質。</p></div><span class="pill">本週判讀中</span></div><div class="flow"><div class="step"><b>1｜實跑證據</b><span>Garmin 或手動紀錄補足「實際做了什麼」。</span></div><div class="step"><b>2｜主課品質</b><span>品質課不只看公里數，要看主課完成度。</span></div><div class="step active"><b>3｜教練判讀</b><span>結合恢復訊號，決定維持、調整或降載。</span></div><div class="step"><b>4｜歷史保護</b><span>已結束週的當時判斷會保留，不被新資料覆寫。</span></div></div><div class="decision"><b>目前結論：可維持／保守前進</b><p>證據完整，但不因單趟跑得快而跳級。</p><button>查看本週判讀依據</button></div></section></main></html>
