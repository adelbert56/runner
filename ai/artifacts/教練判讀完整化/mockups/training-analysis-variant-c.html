<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>變體 C</title><style>:root{--ink:#1f2a24;--muted:#65736b;--soft:#f6f4ee;--surface:#fff;--line:#e2ded4;--green-dark:#155338;--radius:10px}*{box-sizing:border-box}body{margin:0;background:#1f2a2455;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}main{max-width:560px;margin:72px auto;padding:0 20px}.modal{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:0 18px 48px #1f2a2440}.eyebrow{font-size:12px;color:var(--green-dark);font-weight:700}.headline{font-size:24px;font-weight:800;margin:8px 0}.copy{color:var(--muted);font-size:14px;line-height:1.6}.check{padding:12px 0;border-top:1px solid var(--line);font-size:14px}.action{background:var(--green-dark);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:700}@media(max-width:640px){main{margin:24px auto;padding:0 12px}.modal{padding:16px}.headline{font-size:20px}}</style><main><section class="modal"><div class="eyebrow">跑後 48 小時</div><h1 class="headline">回收這次訓練反應</h1><p class="copy">補完後才會判定能否安排下一次速度或長跑。</p><div class="check">□ 左腳無痛、步態正常</div><div class="check">□ 睡眠與疲勞已回到正常</div><div class="check">□ 補給沒有腸胃不適</div><button class="action">儲存並取得下週建議</button></section></main></html>
