<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>單堂判讀 C</title><style>:root{--c-bg:#f6f8f5;--c-surface:#fff;--c-surface2:#f5f8f5;--c-border:#d9e3db;--c-text:#17251f;--c-text-muted:#607168;--c-primary:#0e6245;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}.wrap{max-width:960px;margin:auto;padding:32px 24px}.card{background:var(--c-surface);border-radius:var(--r);padding:24px;box-shadow:0 12px 30px rgba(23,37,31,.06)}.k{font-size:12px;font-weight:700;color:var(--c-primary)}h1{font-size:24px;margin:4px 0}.line{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--c-border)}.line:first-of-type{margin-top:20px}.km{font-weight:700;color:var(--c-primary)}.line b{font-size:16px}.line p{font-size:14px;color:var(--c-text-muted);margin:4px 0}.final{margin-top:16px;padding:16px;background:var(--c-surface2);border-radius:12px}.final b{font-size:18px}@media(max-width:640px){.wrap{padding:16px}.card{padding:20px}.line{grid-template-columns:60px 1fr}}</style><body><main class="wrap"><section class="card"><div class="k">COACH REVIEW · LAP STORY</div><h1>這堂穩定跑怎麼看</h1><div class="line"><div class="km">1–2K</div><div><b>以保守節奏進入主課</b><p>7:07–7:08/km，HR 127→139；步頻已穩住。</p></div></div><div class="line"><div class="km">3–5K</div><div><b>速度逐步上來，沒有步頻失控</b><p>7:02→6:57/km，HR 144→153；屬於可追蹤的漸進。</p></div></div><div class="line"><div class="km">6K</div><div><b>末段加速，心率同步提高</b><p>6:33/km、HR 158；不是可直接外推到全程的新目標。</p></div></div><div class="final"><div class="k">下一步</div><b>照原課表維持；等更多同課型主課後再判斷是否真的進步。</b></div></section></main></body></html>
