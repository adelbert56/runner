<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>單堂判讀 B</title><style>:root{--c-bg:#f6f8f5;--c-surface:#fff;--c-surface2:#f5f8f5;--c-border:#d9e3db;--c-text:#17251f;--c-text-muted:#607168;--c-primary:#0e6245;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}.wrap{max-width:1160px;margin:auto;padding:32px 24px}.card{background:var(--c-surface);border-radius:var(--r);padding:24px;box-shadow:0 12px 30px rgba(23,37,31,.06)}.k{font-size:12px;font-weight:700;color:var(--c-primary)}h1{font-size:24px;margin:4px 0}.muted{font-size:14px;color:var(--c-text-muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.metric{padding:16px;background:var(--c-surface2);border-radius:12px}.metric b{display:block;font-size:20px}.metric span{font-size:13px;color:var(--c-text-muted)}.note{border-top:1px solid var(--c-border);padding-top:20px}.note strong{font-size:18px}.pill{color:var(--c-primary);font-weight:700}@media(max-width:640px){.wrap{padding:16px}.card{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}</style><body><main class="wrap"><section class="card"><div class="k">COACH REVIEW · SCORECARD</div><h1>穩定跑｜指標總覽</h1><p class="muted">主課 6.00 km；已排除熱身與收操</p><div class="grid"><div class="metric"><span>平均配速</span><b>6:57/km</b><span>第 6K 最快 6:33</span></div><div class="metric"><span>平均心率</span><b>HR 145</b><span>後半 +17 bpm</span></div><div class="metric"><span>平均步頻</span><b>179 spm</b><span>穩定於 176–181</span></div><div class="metric"><span>可比樣本</span><b>2 / 2</b><span>不足以調整課表</span></div></div><div class="note"><span class="pill">保守維持</span><p><strong>配速與步頻穩定，末段加速伴隨心率上升。</strong></p><p class="muted">下一次維持原處方，不提前調快。完整課表、環境條件與分段依據另可展開。</p></div></section></main></body></html>
