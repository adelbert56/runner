<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variant B — 時間軸卡</title><link rel="stylesheet" href="../../../../site/styles.css"><style>body{padding:32px}.mock{max-width:1120px;margin:auto}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.milestone{padding:14px;border-radius:var(--radius-sm);background:var(--panel)}.milestone strong{display:block;color:var(--green-dark);font-size:1.2rem}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.facts div{padding:12px;border-top:3px solid var(--green);background:#fff}.facts b{display:block;color:var(--muted);font-size:.78rem}@media(max-width:700px){body{padding:16px}.timeline,.facts{grid-template-columns:1fr}}</style></head><body><main class="mock"><h1>時間軸卡</h1><p>讓開報、截止與比賽日成為主要閱讀節奏。</p><article class="race-card" style="grid-template-columns:112px minmax(0,1fr)"><div class="date-block"><div><span>2026</span><strong>11/15</strong><em>週日</em></div></div><div class="race-main"><h3>慵懶跑者聚樂部－COZY RUNNER CLUB</h3><div class="race-summary-line"><span>臺中市</span><span>10km / 5km</span><span>報名中</span></div><div class="timeline"><div class="milestone"><b>開放報名</b><strong>06/23</strong></div><div class="milestone"><b>截止報名</b><strong>09/10</strong></div><div class="milestone"><b>比賽日</b><strong>11/15</strong></div></div><div class="facts"><div><b>距離</b>10km / 5km</div><div><b>主辦</b>慵懶跑者聚樂部</div><div><b>開跑</b>待確認</div><div><b>來源</b>官方直連</div></div></div></article></main></body></html>
