<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>報名流程 A</title><link rel="stylesheet" href="../../../../site/styles.css"><style>body{background:var(--soft);color:var(--ink);font:14px/1.55 system-ui,"Microsoft JhengHei",sans-serif;margin:0}.page{max-width:1120px;margin:32px auto;padding:0 24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-card)}.eyebrow{color:var(--muted);font-size:12px;margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.step{padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted)}.step b{display:block;color:var(--ink)}.step.active{border-color:var(--green);background:var(--soft);color:var(--green-dark)}.step.active b{color:var(--green-dark)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}.field span{color:var(--muted);font-size:12px;display:block}.cta{margin-top:16px;padding:12px 16px;background:var(--green);border:0;border-radius:var(--radius-sm);color:var(--surface);font-weight:800}@media(max-width:640px){.page{margin:16px auto;padding:0 16px}.steps,.grid{grid-template-columns:1fr}.card{padding:16px}}</style><main class="page"><p class="eyebrow">報名工作區 / 變體 A</p><section class="card"><h1>2026 山城路跑</h1><p>帶入賽事後，依序完成三個步驟。</p><div class="steps"><div class="step active"><b>1. 選擇隊員</b>可多人建立</div><div class="step"><b>2. 選擇組別</b>帶入賽事組別</div><div class="step"><b>3. 建立報名</b>儲存後進入待辦</div></div><div class="grid"><div class="field"><span>參加人員</span>請勾選隊員</div><div class="field"><span>距離 / 組別</span>10K</div></div><button class="cta">建立報名紀錄</button></section></main></html>
