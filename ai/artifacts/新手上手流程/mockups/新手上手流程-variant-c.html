<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>變體 C・首次進站 modal</title>
<link rel="stylesheet" href="../../../../site/styles.css">
<link rel="stylesheet" href="../../../../site/trainer.css">
<style>
  body { background: var(--c-bg); padding: 32px; max-width: 820px; margin: 0 auto; }
  .variant-label { font-size: 12px; font-weight: 800; color: var(--c-primary-hover); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(23,37,31,.42); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-onboarding-list { margin:14px 0 18px; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .modal-onboarding-list li { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.6; color:var(--c-text); }
  .modal-onboarding-list li .num { flex:0 0 auto; width:22px; height:22px; border-radius:999px; background:var(--c-tint-green); color:var(--c-primary-hover); font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="variant-label">變體 C — 首次進站 modal（沿用既有 .modal 元件，關閉後才看到表單）</div>

  <div class="card">
    <div class="card-title">📋 訓練手冊設定</div>
    <p style="font-size:15px;line-height:1.7;color:var(--c-text-muted);margin-bottom:24px;filter:blur(1.5px);opacity:.5">這個功能不是只吐出課表，而是依你的目標、可訓練日、目前跑量與恢復條件，生成一份可放進手機的個人訓練手冊。（表單被 modal 蓋住的示意）</p>
  </div>

  <div class="modal-backdrop">
    <div class="modal" style="max-width:460px">
      <div class="card-title" style="margin-bottom:6px">歡迎使用練跑計畫</div>
      <p style="margin:0 0 4px;color:var(--c-text-muted);font-size:14px;line-height:1.65">依你的目標與可訓練日自動生成訓練手冊，之後跟著 Garmin 實跑動態調整。填表單前，先花 20 秒看懂三件事：</p>
      <ul class="modal-onboarding-list">
        <li><span class="num">1</span><span>先設定目標賽事、日期與可訓練日，1 分鐘可以填完。</span></li>
        <li><span class="num">2</span><span>系統會自動排出節奏跑、長跑、恢復日，不用自己想菜單。</span></li>
        <li><span class="num">3</span><span>之後同步 Garmin 實跑，配速與強度會自動校正，不用手動改課表。</span></li>
      </ul>
      <div class="training-status-actions" style="justify-content:flex-end">
        <button class="btn btn-primary">了解了，開始設定</button>
      </div>
    </div>
  </div>
</body>
</html>
