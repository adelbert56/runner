<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>變體 A・四格說明卡</title>
<link rel="stylesheet" href="../../../../site/styles.css">
<link rel="stylesheet" href="../../../../site/trainer.css">
<style>
  body { background: var(--c-bg); padding: 32px; max-width: 820px; margin: 0 auto; }
  .variant-label { font-size: 12px; font-weight: 800; color: var(--c-primary-hover); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .tab-intro-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .tab-intro-item { padding:12px; border-radius: var(--radius-md); background:rgba(255,255,255,.72); border:1px solid rgba(31,42,36,.08); }
  .tab-intro-item .ti-icon { font-size:17px; margin-bottom:5px; }
  .tab-intro-item .ti-title { font-size:12.5px; font-weight:850; color:var(--c-text); margin-bottom:3px; }
  .tab-intro-item .ti-desc { font-size:11.5px; color:var(--c-text-muted); line-height:1.5; }
  @media (max-width:640px){ .tab-intro-grid{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
  <div class="variant-label">變體 A — 四格說明卡（沿用 runner-guide-card，緊接在三步上手卡下方）</div>

  <section class="runner-guide-card" aria-label="新手三步上手" style="margin-bottom:10px">
    <div class="runner-guide-head">
      <div><div class="runner-guide-kicker">Start here</div><div class="runner-guide-title">先做好這三步，課表才會越來越準</div><p class="runner-guide-copy">不需要每天填一堆數字；先把執行、回報與恢復做成習慣。</p></div>
      <button class="btn btn-secondary" style="padding:6px 10px;font-size:12px">暫時隱藏</button>
    </div>
  </section>

  <section class="runner-guide-card" aria-label="四個分頁導覽">
    <div class="runner-guide-head">
      <div><div class="runner-guide-kicker">Where to look</div><div class="runner-guide-title">上面四個分頁分別在做什麼</div><p class="runner-guide-copy">之後不同狀況去不同分頁看，這裡先花 10 秒認識一次。</p></div>
      <button class="btn btn-secondary" style="padding:6px 10px;font-size:12px;white-space:nowrap">知道了，關閉</button>
    </div>
    <div class="tab-intro-grid">
      <div class="tab-intro-item"><div class="ti-icon">📅</div><div class="ti-title">本週課表</div><div class="ti-desc">每天照著執行的正式菜單，這是唯一的執行來源。</div></div>
      <div class="tab-intro-item"><div class="ti-icon">🏃</div><div class="ti-title">教練建議</div><div class="ti-desc">Garmin 同步後的判讀依據、風險提醒與逐週決策。</div></div>
      <div class="tab-intro-item"><div class="ti-icon">📝</div><div class="ti-title">週評估</div><div class="ti-desc">每週結束前回報身體狀況，決定下週要不要調整。</div></div>
      <div class="tab-intro-item"><div class="ti-icon">📈</div><div class="ti-title">進度與分析</div><div class="ti-desc">長期跑量、配速趨勢，以及週期／賽事管理。</div></div>
    </div>
  </section>
</body>
</html>
