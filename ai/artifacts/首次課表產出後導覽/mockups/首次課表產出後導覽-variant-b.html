<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>變體 B・合併進單張三步卡</title>
<link rel="stylesheet" href="../../../../site/styles.css">
<link rel="stylesheet" href="../../../../site/trainer.css">
<style>
  body { background: var(--c-bg); padding: 32px; max-width: 820px; margin: 0 auto; }
  .variant-label { font-size: 12px; font-weight: 800; color: var(--c-primary-hover); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .tab-intro-inline { margin-top:14px; padding-top:12px; border-top:1px dashed rgba(31,42,36,.12); }
  .tab-intro-inline-title { font-size:12px; font-weight:850; color:var(--c-text-muted); margin-bottom:8px; }
  .tab-intro-row { display:flex; flex-wrap:wrap; gap:8px; }
  .tab-intro-chip { flex:1 1 150px; padding:9px 11px; border-radius: var(--radius-md); background:rgba(255,255,255,.72); border:1px solid rgba(31,42,36,.08); font-size:12px; line-height:1.5; }
  .tab-intro-chip b { display:block; color:var(--c-text); font-size:12.5px; margin-bottom:2px; }
  .tab-intro-chip span { color:var(--c-text-muted); }
</style>
</head>
<body>
  <div class="variant-label">變體 B — 合併進單張三步卡（只多一張卡片的下半段，不新增第二張卡片）</div>

  <section class="runner-guide-card" aria-label="新手三步上手">
    <div class="runner-guide-head">
      <div><div class="runner-guide-kicker">Start here</div><div class="runner-guide-title">先做好這三步，課表才會越來越準</div><p class="runner-guide-copy">不需要每天填一堆數字；先把執行、回報與恢復做成習慣。</p></div>
      <button class="btn btn-secondary" style="padding:6px 10px;font-size:12px;white-space:nowrap">暫時隱藏</button>
    </div>
    <ul class="runner-guide-list">
      <li>今天先照卡片完成一堂；不需要另外解讀整份週期。</li>
      <li>跑完先讀取 Garmin 實跑；未同步時才用「手動補登」。若跳過，填原因就好，不需要硬補課。</li>
      <li>每週最後做一次週評估，我才能判斷下週要維持、降載，還是小幅往前推。</li>
    </ul>

    <div class="tab-intro-inline">
      <div class="tab-intro-inline-title">上面四個分頁在做什麼</div>
      <div class="tab-intro-row">
        <div class="tab-intro-chip"><b>📅 本週課表</b><span>每天照著執行的正式菜單</span></div>
        <div class="tab-intro-chip"><b>🏃 教練建議</b><span>Garmin 判讀依據與逐週決策</span></div>
        <div class="tab-intro-chip"><b>📝 週評估</b><span>每週回報，決定下週怎麼調</span></div>
        <div class="tab-intro-chip"><b>📈 進度與分析</b><span>長期趨勢與週期管理</span></div>
      </div>
    </div>
  </section>
</body>
</html>
